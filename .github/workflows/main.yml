
name: Build Ramad AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p appsrc
          unzip -o ramad_ai_android_0_3_project.zip -d appsrc
          echo "Files extracted:"
          find appsrc -maxdepth 4 -type f | head -100

      - name: Build APK
        run: |
          PROJECT_FILE=$(find appsrc -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) | head -1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ramad-ai-0.3-apk
          path: appsrc/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
